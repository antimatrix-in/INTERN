<header class="navbar">
  <div class="container navbar-inner">
    <a href="https://www.antimatrix.co.in/" target="_blank" rel="noopener noreferrer" class="brand-logo" aria-label="ANTI-MATRIX Home" title="Anti-Matrix | Enterprise Digital Transformation">
      <img src="{{ url_for('static', filename='img/logo_transparent.png') }}" alt="ANTI-MATRIX" class="navbar-logo-img">
    </a>

    <div class="nav-actions" style="margin-left: auto;">
      <a href="{{ url_for('main.verify_search') }}" class="nav-link-item">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><polyline points="9 12 11 14 15 10"></polyline></svg>
        Verify Certificate
      </a>
      {% if current_user.is_authenticated %}
        {% if current_user.is_admin_or_staff %}
          <a href="{{ url_for('admin.dashboard') }}" class="btn btn-outline-primary btn-sm">Admin Dashboard</a>
        {% else %}
          <a href="{{ url_for('student.dashboard') }}" class="btn btn-outline-primary btn-sm">Student Dashboard</a>
        {% endif %}
        <a href="{{ url_for('auth.logout') }}" class="btn btn-secondary btn-sm">Sign Out</a>
      {% else %}
        <a href="{{ url_for('auth.login') }}" class="btn btn-primary btn-sm">Student Login</a>
        <a href="{{ url_for('auth.admin_login') }}" class="btn btn-secondary btn-sm">Staff Login</a>
      {% endif %}
    </div>
  </div>
</header>
