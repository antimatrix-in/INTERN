<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <!-- Green Diamond Gradients -->
    <linearGradient id="gemLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86EFAC" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>
    <linearGradient id="gemDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803D" />
      <stop offset="100%" stop-color="#052E16" />
    </linearGradient>
    <linearGradient id="gemMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="greenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(150, 20)">
    <!-- Square Frame with cutout top-right -->
    <path d="M 60,30 L 210,30 A 1,1 0 0,0 210,30 L 210,50 L 80,50 L 80,180 L 220,180 L 220,110 L 240,110 L 240,200 L 60,200 Z" fill="#0F172A" />

    <!-- Faceted Green Diamond (Top Right Vertex) -->
    <g transform="translate(200, 15) scale(1.1)" filter="url(#greenGlow)">
      <!-- Top Left Facet -->
      <polygon points="25,0 45,0 35,20 15,20" fill="url(#gemLight)" />
      <!-- Top Right Facet -->
      <polygon points="45,0 65,25 35,20" fill="url(#gemMid)" />
      <!-- Top Peak Facet -->
      <polygon points="25,0 35,20 0,25" fill="url(#gemLight)" />
      <!-- Bottom Left Facet -->
      <polygon points="15,20 35,20 35,50 0,25" fill="url(#gemMid)" />
      <!-- Bottom Right Facet -->
      <polygon points="35,20 65,25 35,50" fill="url(#gemDark)" />
    </g>
  </g>

  <!-- ANTI - MATRIX Typography -->
  <g transform="translate(40, 240)">
    <!-- ANTI (Black) -->
    <!-- A: Chevron Shape -->
    <path d="M 0,45 L 20,0 L 40,45 L 28,45 L 20,18 L 12,45 Z" fill="#0F172A" />
    <!-- N -->
    <path d="M 50,0 L 64,0 L 84,32 L 84,0 L 96,0 L 96,45 L 82,45 L 62,13 L 62,45 L 50,45 Z" fill="#0F172A" />
    <!-- T -->
    <path d="M 106,0 L 146,0 L 146,10 L 131,10 L 131,45 L 121,45 L 121,10 L 106,10 Z" fill="#0F172A" />
    <!-- I -->
    <path d="M 156,0 L 168,0 L 168,45 L 156,45 Z" fill="#0F172A" />

    <!-- Hyphen '-' -->
    <rect x="185" y="20" width="22" height="6" fill="#0F172A" rx="1" />

    <!-- MATRIX (Dark Emerald Green) -->
    <!-- M -->
    <path d="M 225,0 L 240,0 L 253,30 L 266,0 L 281,0 L 281,45 L 270,45 L 270,14 L 258,40 L 248,40 L 236,14 L 236,45 L 225,45 Z" fill="#047857" />
    <!-- A: Chevron Shape -->
    <path d="M 290,45 L 310,0 L 330,45 L 318,45 L 310,18 L 302,45 Z" fill="#047857" />
    <!-- T -->
    <path d="M 338,0 L 378,0 L 378,10 L 363,10 L 363,45 L 353,45 L 353,10 L 338,10 Z" fill="#047857" />
    <!-- R -->
    <path d="M 388,0 L 412,0 C 424,0 430,5 430,14 C 430,21 424,26 414,27 L 432,45 L 418,45 L 402,28 L 400,28 L 400,45 L 388,45 Z M 400,9 L 400,19 L 410,19 C 416,19 418,17 418,14 C 418,11 416,9 410,9 Z" fill="#047857" />
    <!-- I -->
    <path d="M 440,0 L 452,0 L 452,45 L 440,45 Z" fill="#047857" />
    <!-- X -->
    <path d="M 462,0 L 476,0 L 490,21 L 504,0 L 518,0 L 498,28 L 520,45 L 506,45 L 490,21 L 474,45 L 460,45 L 482,28 Z" fill="#047857" />
  </g>

  <!-- Subtitle Tagline Line -->
  <g transform="translate(20, 310)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#047857" stroke-width="2" />
    <text x="75" y="4" font-family="'Inter', 'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#0F172A" letter-spacing="1">BREAK THE MATRIX</text>
    <polygon points="215,0 219,-4 223,0 219,4" fill="#047857" />
    <text x="235" y="4" font-family="'Inter', 'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#0F172A" letter-spacing="1">THINK DIFFERENT</text>
    <polygon points="375,0 379,-4 383,0 379,4" fill="#047857" />
    <text x="395" y="4" font-family="'Inter', 'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#0F172A" letter-spacing="1">CREATE THE FUTURE</text>
    <line x1="535" y1="0" x2="595" y2="0" stroke="#047857" stroke-width="2" />
  </g>
</svg>
